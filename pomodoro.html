<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pomodoro</title>
</head>
<body>
    <div class="container">
        <div class="circle">
            <div class="clock-change-up">
                <img onclick= "click_up()" src="images\keyboard_arrow_up.svg" alt="up">
                <img onclick= "click_up()" src="images\keyboard_arrow_up.svg" alt="up">
                <img onclick= "click_up()" src="images\keyboard_arrow_up.svg" alt="up">
            </div>
            <h1>00:00:00</h1>
            <div class="clock-change-down">
                <img onclick= "click_down()" src="images\keyboard_arrow_down.svg" alt="down">
                <img onclick= "click_down()" src="images\keyboard_arrow_down.svg" alt="down">
                <img onclick= "click_down()" src="images\keyboard_arrow_down.svg" alt="down">
            </div>
        </div>
        <div class="buttons-pomodoro">
            <button>Reset</button>
            <button>Start</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
