<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pomodoro</title>
</head>
<body>
    <div class="container-all">
        <div class="circle">
            <div class="container-clock">
                <div class="clock_minutes_up">
                    <img onclick="click_minutes_up()" src="images\keyboard_arrow_up.svg" alt="up">
                        <span id="minutes">0</span> 
                    <img onclick="click_minutes_down()" src="images\keyboard_arrow_down.svg" alt="down">
                </div>

                <span>:</span> 

                <div class="clock_seconds_down">
                    <img onclick="click_seconds_up()" src="images\keyboard_arrow_up.svg" alt="up">
                        <span id="seconds">0</span> 
                    <img onclick="click_seconds_down()" src="images\keyboard_arrow_down.svg" alt="down">
                </div>
            </div>
        </div>

        <div class="buttons-pomodoro">
            <button onclick= "reset()">Reset</button>
            <button>Start</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
