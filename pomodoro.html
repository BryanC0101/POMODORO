<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pomodoro</title>
</head>
<body>
    <div class="music-button">
        <img src="images/playlistMusic.svg" alt="music">
    </div>
    <div class="sidebar">
        <h1>Musics</h1>
        <div class="container-musics">
            <span id="dylan">Dylan</span>
            <span id="george">George Harrison</span>
            <span id="lennon">John Lennon</span>
            <span id="invisible">Invisible</span>
            <span id="jethrotull">Jethro Tull</span>
        </div>
    </div>

    <div class="container-all">

        <div class="circle">
            <div class="container-clock">
                <div class="clock_minutes_up">
                    <img class="icons" onclick="click_minutes_up()" src="images\up_arrow.svg" alt="up">
                        <h1 id="minutes">0</h1> 
                    <img class="icons" onclick="click_minutes_down()" src="images\down_arrow.svg" alt="down">
                </div>

                <h1>:</h1> 

                <div class="clock_seconds_down">
                    <img class="icons" onclick="click_seconds_up()" src="images\up_arrow.svg" alt="up">
                        <h1 id="seconds">0</h1> 
                    <img class="icons" onclick="click_seconds_down()" src="images\down_arrow.svg" alt="down">
                </div>
            </div>
        </div>

        <div class="buttons-pomodoro">
            <button onclick="reset()">Reset</button>
            <button id="startAndPause" onclick= "start()">Start</button>
        </div>
    </div>
    <audio id="player"></audio>

    <script src="script.js"></script>
</body>
</html>
